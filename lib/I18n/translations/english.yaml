STR_BACCARAT_RULE_TIE: "Tie wins pay 8:1. When the hands tie, Player and Banker bets are returned. A losing Tie bet is lost."
STR_BACCARAT_RULE_SAVE: "Deal places your bet. Reveal card turns over one card at a time. Winnings arrive after the last reveal. Progress saves automatically."
